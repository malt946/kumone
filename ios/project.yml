# XcodeGen manifest for the iOS app shell.
# Regenerate the project with: cd ios && xcodegen generate
name: KumoneIOS
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  KumoneIOSPackage:
    path: KumoneIOSPackage
targets:
  KumoneIOS:
    type: application
    platform: iOS
    sources:
      - KumoneIOS
      - path: ../Sources/Kumone/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: KumoneIOSPackage
        product: KumoneIOSFeature
    settings:
      base:
        # CODE_SIGN_ENTITLEMENTS 在 Config/Shared.xcconfig 中通过
        # $(KUMONE_ENTITLEMENTS_FILE) 指定，此处不覆盖，避免 target 级设置
        # 屏蔽 xcconfig 中的配置。
        ENABLE_PREVIEWS: YES
  KumoneIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KumoneIOSUITests
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
    dependencies:
      - target: KumoneIOS
schemes:
  KumoneIOS:
    build:
      targets:
        KumoneIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KumoneIOSUITests
    archive:
      config: Release
